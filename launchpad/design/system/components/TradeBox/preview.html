<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TradeBox</title></head>
<body>
<div class="pp-demo-col"><div class="pp-trade"><div class="pp-seg is-trade" role="group" aria-label="Side"><button data-side="buy" aria-pressed="true">Buy</button><button data-side="sell" aria-pressed="false">Sell</button></div><div class="pp-field"><label for="tb-amt">You pay</label><div class="pp-amount"><input id="tb-amt" inputmode="decimal" value="0.05"><button class="pp-token"><i></i>ETH ▾</button></div><div class="pp-presets"><button>0.01</button><button>0.05</button><button>0.1</button><button>Max</button></div></div><div class="pp-quote"><div><span>You get (at least)</span><b>2,912,400 $RIBBIT</b></div><div><span>Route</span><b>ETH → IMD → $RIBBIT</b></div><div><span>Price impact</span><b>0.8%</b></div><div><span>Slippage</span><b>1% ▾</b></div><div class="pp-fee"><span>Fee</span><b>2.0% (1.5% base + 0.5% to holders)</b></div></div><button class="pp-btn pp-btn-buy pp-btn-block">Buy $RIBBIT</button></div></div>
</body>
