[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# PondPad (the first client) is read from ../../launchpad for the integration tests only.
allow_paths = ["../../launchpad/contracts/src"]
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[lint]
lint_on_build = false
